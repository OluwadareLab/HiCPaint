device: cuda

dir:
  model_state: ./output/checkpoints
  output: ./output
  data: ./dataset/dataset_dict_5000_256
  image: /home/hc0783.unt.ad.unt.edu/workspace/hicinterpolate/datasets/timeseries/new_triplets

file:
  dataset_dict: ./dataset/dataset_dict_5000_256
  model: ${dir.model_state}/best_model.pt
  test_hic_map: ${dir.output}/inference
  num_visualization_samples: 2
  val_metrics: ${dir.output}/val_metrics.csv
  train_val_loss_plot: ${dir.output}/train_val_loss_plot.png
  log: ${dir.output}/train.log

data:
  batch_size: 8
  mask_size: 64
  mask_placement: mixed   # diagonal | random (anywhere) | mixed (50/50 per sample)
  num_workers: 4
  seed: 42
  subset_fraction: 1.0

training:
  epochs: 100
  save_every: 5
  lr: 2.0e-4
  min_lr: 1.0e-6
  weight_decay: 0.02      # applied to matmul/conv weights only (not norms/biases)
  warmup_epochs: 5
  grad_clip: 1.0
  patience: 0
  ema_decay: 0.9995       # EMA weights are evaluated and checkpointed; 0 disables
  use_amp: true           # bf16 autocast (FFT/spectral terms stay fp32)
  # Min-SNR-gamma weighting; 0 disables. Keep 0 for prediction=x0: the x0 target is
  # already uniformly scaled, and min(SNR, gamma) would down-weight exactly the high-t
  # samples that one-step inference (infer_t = T-1) runs on. Use 5.0 for prediction=eps.
  min_snr_gamma: 0.0
  high_t_bias: 0.5        # fraction of samples drawn from the top decile of t
  zero_hole_prob: 0.25    # fraction trained at t=T-1 with zeroed hole (one-step infer input)
  # Base reconstruction loss (always on)
  charbonnier_weight: 1.0
  charbonnier_eps: 1.0e-3
  # Hi-C structure terms (unlock with SSIM)
  strat_weight: 0.5
  insulation_weight: 0.25
  insulation_window: 8
  grad_weight: 0.05
  dist_weight: 0.0
  spectral_weight: 0.0
  # *_t_max_frac gates losses to t <= frac*T; 1.0 = every t, incl. infer_t = T-1
  struct_t_max_frac: 1.0
  # Adversarial
  adv_weight: 0.05
  adv_mse_threshold: 0.4
  adv_t_max_frac: 1.0
  fm_weight: 2.0          # D feature-matching L1 on adv-gated samples; 0 disables
  d_lr: 1.0e-4
  adv_real_label: 0.9
  adv_fake_label: 0.1
  d_r1_gamma: 10.0
  d_r1_every: 16
  ssim_weight: 0.1
  ssim_mse_threshold: 0.5
  ssim_t_max_frac: 1.0
  x0_l1_weight: 0.0       # folded into charbonnier; keep 0 to avoid double-counting
  x0_l1_t_max_frac: 0.3
  # Best checkpoint selection on masked PSNR/SSIM/FID
  best_selection: balanced   # balanced (pareto + maximin) | weighted (legacy sum below)
  best_min_epoch: 5          # ignore warmup epochs for selection
  # weighted: maximize w*(PSNR/40) + w*(SSIM/1) - w*(FID/350)
  best_psnr_weight: 1.0
  best_ssim_weight: 1.0
  best_fid_weight: 1.0

model:
  # Spatial / diffusion
  image_size: 256
  patch_size: 8
  num_timesteps: 1000
  prediction: x0          # x0 | eps
  learn_sigma: false      # sigma channel gets no gradient without a VLB term

  # Stage 2: DiT backbone
  hidden_size: 512
  depth: 8                # main self-attn DiTBlock count
  num_heads: 8
  dropout: 0.05           # proj dropout; attention dropout stays 0
  mask_attn_bias: 4.0     # soft down-weight hole keys (MAT-style)

  # Structure stream (edge / line / dot) + cross-attn into main
  structure_depth: 4      # structure DiTBlock + DiTCrossBlock count each

  # Stage 1: FFC front-end (local conv + global Fourier) before patchify
  stem_channels: 64       # ConvStem out channels (main + structure)
  ffc_blocks: 4           # residual FFCBlock count per stream; 0 disables
  ffc_ratio_global: 0.5   # fraction of stem channels through Fourier branch
  ffc_downsample: 1       # 2 runs the FFTs at half resolution (4x cheaper)

  # Stage 3: local (window) + global (pooled) attention
  lg_blocks: 2
  lg_window: 4            # token-grid window side; grid is image_size/patch_size
  lg_pool: 4              # token-grid pooling factor for global keys/values

  # Stage 4: conv output head
  mid_channels: 64        # unpatchify feature channels
  conv_head_blocks: 2     # residual conv blocks before the decoder
inference:
  split: val
  batch_size: 4
  num_samples: 0
  t: -1                   # one-step infer/viz timestep; <0 → T-1
  save_npy: false
  viz_per_chromosome: 2
  viz_name: inference_grid.png
