device: cuda

dir:
  model_state: ./output/checkpoints
  output: ./output
  data: ./dataset/dataset_dict_5000_256
  image: /home/hc0783.unt.ad.unt.edu/workspace/hicinterpolate/datasets/timeseries/new_triplets

file:
  dataset_dict: ./dataset/dataset_dict_5000_256
  model: ${dir.model_state}/best_model.pt
  test_hic_map: ${dir.output}/inference
  num_visualization_samples: 2
  val_metrics: ${dir.output}/val_metrics.csv
  train_val_loss_plot: ${dir.output}/train_val_loss_plot.png
  log: ${dir.output}/train.log

data:
  batch_size: 6
  mask_size: 64
  num_workers: 4
  seed: 42
  subset_fraction: 1.0

training:
  epochs: 50
  save_every: 5
  lr: 1.0e-4
  min_lr: 1.0e-6
  weight_decay: 0.0
  warmup_epochs: 5
  grad_clip: 1.0
  patience: 0
  adv_weight: 0.1
  adv_mse_threshold: 0.4
  adv_t_max_frac: 0.5
  d_lr: 1.0e-4
  adv_real_label: 0.9
  adv_fake_label: 0.1
  ssim_weight: 0.1
  ssim_mse_threshold: 0.5
  ssim_t_max_frac: 0.5
  x0_l1_weight: 1.0
  x0_l1_t_max_frac: 0.3
  # Best checkpoint: maximize w_psnr*psnr_masked + w_ssim*ssim_masked - w_fid*fid_masked
  best_psnr_weight: 1.0
  best_ssim_weight: 100.0
  best_fid_weight: 1.0

model:
  image_size: 256
  patch_size: 8
  hidden_size: 768
  depth: 12
  num_heads: 8
  dropout: 0.2
  ffc_blocks: 4
  stem_channels: 64
  mid_channels: 64
  mask_attn_bias: 4.0
  prediction: x0
  infer_t: -1
  learn_sigma: false
  num_timesteps: 1000

inference:
  split: val
  batch_size: 8
  num_samples: 0
  save_npy: false
  viz_per_chromosome: 2
  viz_name: inference_grid.png
